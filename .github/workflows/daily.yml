name: Daily data job

on:
  schedule:
    # About 04:17 UTC. Not on the hour: GitHub delays on-the-hour schedules the most
    # (the 05:00 run was starting around 12:00-13:00).
    - cron: "17 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-data-job
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # Public repository: unlimited free minutes, so the full watch list can run every morning.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: |
          if [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$REED_API_KEY" ]; then
            echo "::notice::Repository secrets not set yet; skipping the daily job."
            exit 0
          fi
          # A manual run also re-applies the rules to every stored role.
          npm run daily -- ${{ github.event_name == 'workflow_dispatch' && '--retag' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          REED_MAX_HOURLY_WAITS: "2"
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      # Morning alerts (Telegram and email digest); switched off until their keys are added.
      - run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then exit 0; fi
          npm run alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
